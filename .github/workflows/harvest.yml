name: harvest

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore harvester cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/geofeeds
            .cache/rir-bulk
            .cache/direct-geofeeds
          key: geofeed-harvester-${{ github.run_id }}
          restore-keys: |
            geofeed-harvester-

      - name: Harvest
        run: |
          geofeed-harvester \
            --auto-discover \
            --out-dir dist \
            --cache-dir .cache/geofeeds \
            --bulk-dir .cache/rir-bulk \
            --direct-geofeed-dir .cache/direct-geofeeds \
            --normalized-rir-dump data/rir.txt \
            --concurrency 32

      - name: Compress dataset
        run: |
          gzip -9 -c dist/geofeed.csv > dist/geofeed.csv.gz
          gzip -9 -c dist/geofeed.jsonl > dist/geofeed.jsonl.gz
          sha256sum dist/geofeed.csv dist/geofeed.csv.gz dist/geofeed.jsonl dist/geofeed.jsonl.gz > dist/SHA256SUMS

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: geofeed-dataset
          path: |
            dist/geofeed.csv.gz
            dist/geofeed.jsonl.gz
            dist/changelog.md
            dist/SHA256SUMS
          retention-days: 30

      - name: Commit small run metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p runs
          cp dist/changelog.md runs/latest-changelog.md
          cp dist/SHA256SUMS runs/latest-SHA256SUMS
          git add runs/latest-changelog.md runs/latest-SHA256SUMS
          git diff --cached --quiet || git commit -m "Update harvested geofeed dataset"
          git push
